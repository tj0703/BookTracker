[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app-cli"
version = "0.1.0"
description = "A Python CLI application"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
app-cli = "app_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/app_cli"]

[tool.pytest.ini_options]
markers = [
    "e2e_live: hits the real Finna API; excluded by default, run explicitly with -m e2e_live",
]
addopts = '-m "not e2e_live"'
